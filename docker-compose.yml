services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: salon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d salon"]
      interval: 5s
      timeout: 5s
      retries: 10

  # App service: run the app on the host during development (`npm run dev`).
  # Containerized app lands with the Sprint 7 deployment task (TASK-702).
  # app:
  #   build: .
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     DATABASE_URL: postgresql://user:pass@postgres:5432/salon
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres_data:
